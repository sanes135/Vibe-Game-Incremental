[package]
name = "kitty_tycoon"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_color",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "x11",
    "multi_threaded",
    "default_font",
] }

# Быстрая сборка в dev-режиме, но оптимизированный код зависимостей
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
